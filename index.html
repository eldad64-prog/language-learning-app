<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087f8c">
<meta name="description" content="אפליקציה ללימוד תאית ואנגלית">
<style>
:root{--ink:#173247;--muted:#667985;--teal:#087f8c;--blue:#2878d0;--pink:#c64c98;--shadow:0 8px 28px #143a4a18}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#e4f7f4,#f7fbff 48%,#fff2e7);min-height:100vh}
.shell{max-width:560px;margin:auto;min-height:100vh;padding:14px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 4px 16px}
.logo{font-size:32px;background:white;border-radius:15px;padding:8px;box-shadow:var(--shadow)}
header strong,header small{display:block}header small,.muted,small{color:var(--muted)}
.hero{border-radius:24px;padding:24px 18px;background:linear-gradient(145deg,#087f8cdd,#176e9de8);color:#fff;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
.hero .emoji{font-size:45px}.hero h1{font-size:27px;margin:7px 0}
.panel,.profile,.lang-card,.category{background:#ffffffed;border:1px solid #e4eeee;border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.profiles,.languages,.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.profile,.lang-card{margin:0;text-align:center}.avatar{font-size:42px}
.btn{border:0;border-radius:13px;padding:12px;color:white;font-weight:750;font-size:15px;width:100%;margin-top:10px;background:var(--teal)}
.btn.blue{background:var(--blue)}.btn.pink{background:var(--pink)}.btn.light{color:var(--ink);background:#e9f6f5}
.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;color:var(--ink);font-weight:700}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.categories{margin-top:14px}.category{margin:0;text-align:right;min-height:110px;color:var(--ink);font:inherit}
.category span{font-size:28px;display:block}.category strong,.category small{display:block;margin-top:5px}
.phrase{font-size:26px;line-height:1.5;font-weight:800;margin:17px 0 6px;text-align:center}
.roman,.translation{text-align:center;font-size:18px;margin:8px 0}.roman{color:#a04a22}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{display:block;width:100%;text-align:right;background:#f7fbfb;border:1px solid #dce9e8;border-radius:13px;padding:13px;margin:8px 0;font-size:16px;color:var(--ink)}
.answer.correct{border-color:#16845b;background:#e8f8ef}.answer.wrong{border-color:#c94b57;background:#fff0f0}
.progress{height:8px;background:#e7eeee;border-radius:99px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:#18a77a}
footer{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);padding:15px 3px 4px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
@media(min-width:520px){.categories{grid-template-columns:repeat(3,minmax(0,1fr))}}
