<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f8c">
<title>מסע ללימוד שפות</title>
<style>
:root{--teal:#087f8c;--teal2:#10a5a3;--ink:#183238;--muted:#63777b;--bg:#f1f8f7;--card:#fff;--line:#dce9e7;--pink:#bb6b91;--blue:#2d6cdf}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e0f5f1 0,#f5faf9 280px,var(--bg) 100%);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}.shell{max-width:720px;margin:auto;min-height:100vh;padding:14px 16px 24px}header{display:flex;align-items:center;gap:12px;padding:8px 4px 22px}.logo{width:48px;height:48px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 5px 18px #0c77771c}header strong{display:block;font-size:18px}header small{display:block;color:var(--muted);margin-top:2px}.hero{text-align:center;padding:20px 14px 25px}.emoji{font-size:48px}.hero h1{font-size:clamp(27px,7vw,38px);margin:8px 0;color:#124a50}.hero p{color:var(--muted);margin:0;font-size:16px}.panel,.profile,.lang-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 7px 24px #114a5010}.panel h2,.panel h3{margin-top:0}.profiles,.languages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.profile,.lang-card{text-align:center;margin:0;padding:17px 12px}.avatar{width:64px;height:64px;border-radius:22px;background:#e5f7f4;margin:0 auto 10px;display:grid;place-items:center;font-size:34px}.profile h3,.lang-card h3{margin:8px 0}.lang-card p{font-size:14px;color:var(--muted);min-height:38px}.btn{border:0;border-radius:15px;background:var(--teal);color:#fff;padding:12px 15px;font-weight:650;width:100%;margin-top:8px;box-shadow:0 4px 10px #087f8c20}.btn.blue{background:var(--blue)}.btn.pink{background:var(--pink)}.btn.light{background:#edf5f4;color:#24555a;box-shadow:none;border:1px solid var(--line)}.between{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 10px}.between .btn{width:auto;margin:0}.muted,small{color:var(--muted)}.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.category{border:1px solid var(--line);border-radius:20px;background:#fff;padding:16px 12px;text-align:right;color:var(--ink);display:flex;flex-direction:column;gap:7px;min-height:112px;box-shadow:0 5px 16px #114a5009}.category span{font-size:27px}.category strong{font-size:16px}.category small{font-size:12px}.actions{display:flex;gap:10px;margin:14px 0}.actions .btn{flex:1}.phrase{font-size:clamp(24px,6vw,34px);font-weight:750;text-align:center;direction:auto;line-height:1.45;margin:24px 0 8px;overflow-wrap:anywhere}.roman{text-align:center;color:#277b80;font-size:17px;margin:10px 0;direction:ltr}.translation{text-align:center;font-size:21px;font-weight:650;margin:12px 0 22px}.answer{display:block;width:100%;text-align:right;border:1px solid var(--line);border-radius:14px;background:#fbfefd;color:var(--ink);padding:13px 14px;margin-top:9px}.answer:active{background:#e6f7f4}.note{margin-top:12px;color:var(--teal);font-weight:650}footer{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);padding:12px 6px}footer span:last-child{font-weight:700}@media(max-width:390px){.shell{padding:10px}.panel{padding:16px}.profiles,.languages{gap:8px}.profile,.lang-card{padding:13px 8px}.actions{gap:7px}}
</style>
</head>
<body>
<div class="shell">
<header><span class="logo">🌍</span><div><strong>מסע ללימוד שפות</strong><small>לומדים בקצב שלך</small></div></header>
<main id="app"></main>
<footer><span>גרסה ראשונית · ההתקדמות נשמרת במכשיר</span><span id="status">מוכן ללמידה</span></footer>
</div>
<script>
const categories=[["greetings","👋","ברכות והיכרות"],["food","🍜","מסעדות ואוכל"],["transport","🚕","מוניות ותחבורה"],["shopping","🛍️","קניות ושווקים"],["hotel","🏨","מלונות ולינה"],["directions","📍","כיוונים ומקומות"],["health","🩺","בריאות ורפואה"],["money","💰","כסף ומחירים"],["social","💬","חברים ושיחות"],["work","💼","עבודה ועסקים"]];
const phrases={
thai:[
["greetings","สวัสดีครับ","sa-wat-dee khráp","שלום (גבר)"],["greetings","สบายดีไหมครับ","sa-baai-dee mái khráp","מה שלומך?"],["greetings","ขอบคุณครับ","khàawp-khun khráp","תודה"],["greetings","ไม่เป็นไรครับ","mâi pen rai khráp","אין בעיה"],
["food","ขอเมนูหน่อยครับ","khǎaw mee-nuu nòi khráp","אפשר תפריט בבקשה?"],["food","ไม่เผ็ดครับ","mâi phèt khráp","לא חריף"],["food","เช็คบิลด้วยครับ","chék bin dûai khráp","חשבון בבקשה"],
["transport","ไปที่นี่ครับ","bpai thîi nîi khráp","למקום הזה בבקשה"],["transport","จอดตรงนี้ครับ","jàawt dtrong níi khráp","עצור כאן בבקשה"],
["shopping","ลดได้ไหมครับ","lót dâi mái khráp","אפשר הנחה?"],["hotel","มีห้องว่างไหมครับ","mii hâawng wâang mái khráp","יש חדר פנוי?"],
["directions","ห้องน้ำอยู่ที่ไหนครับ","hâawng-náam yùu thîi nǎi khráp","איפה השירותים?"],["health","ผมต้องการพบหมอครับ","phǒm dtâawng-gaan phóp mǎaw khráp","אני צריך לראות רופא"],
["money","รับบัตรเครดิตไหมครับ","ráp bàt khree-dìt mái khráp","מקבלים כרטיס אשראי?"],["social","วันนี้คุณทำอะไรครับ","wan-níi khun tham a-rai khráp","מה אתה עושה היום?"],
["work","ผมขอคิดดูก่อนครับ","phǒm khǎaw khít duu gàawn khráp","אני רוצה לחשוב על זה קודם"]
],
english:[
["greetings","Hello, how are you?","","שלום, מה שלומך?"],["greetings","Nice to meet you.","","נעים להכיר"],["greetings","Could you speak more slowly?","","אפשר לדבר לאט יותר?"],
["food","Could I see the menu, please?","","אפשר לראות את התפריט?"],["food","I'd like a glass of water.","","אני רוצה כוס מים"],["food","Could we have the bill, please?","","אפשר לקבל חשבון?"],
["transport","Please take me to this address.","","קח אותי לכתובת הזאת בבקשה"],["transport","How long will it take?","","כמה זמן זה ייקח?"],
["shopping","Is there a discount?","","יש הנחה?"],["hotel","Do you have a room available?","","יש לכם חדר פנוי?"],
["directions","How do I get there?","","איך מגיעים לשם?"],["health","I need a doctor.","","אני צריך רופא"],["money","Can I pay by card?","","אפשר לשלם בכרטיס?"],
["social","Would you like to have coffee?","","רוצה לשתות קפה?"],["work","Let me check and get back to you.","","תן לי לבדוק ולחזור אליך"]
]};
const app=document.querySelector("#app"),store="language-learning-progress-v1";let db={};try{db=JSON.parse(localStorage.getItem(store)||"{}")}catch(e){}
let s={user:null,lang:null,cat:null,index:0};
const save=()=>localStorage.setItem(store,JSON.stringify(db));
const who=()=>s.user==="eldad"?"אלדד":"ליאורה";
const list=()=>phrases[s.lang].filter(p=>p[0]===s.cat);
const id=p=>s.lang+"|"+p[0]+"|"+p[1];
function button(label,action,cls=""){return '<button class="btn '+cls+'" data-action="'+action+'">'+label+'</button>'}
function render(){
if(!s.user){app.innerHTML='<section class="hero"><div class="emoji">🌴🌍</div><h1>ברוכים הבאים</h1><p>לימוד שפות בדרך שלך</p></section><section class="panel"><h2>מי לומד עכשיו?</h2><div class="profiles"><article class="profile"><div class="avatar">😎</div><h3>אלדד</h3>'+button("המשך כאלדד","user-eldad")+'</article><article class="profile"><div class="avatar">🌷</div><h3>ליאורה</h3>'+button("המשך כליאורה","user-liora","pink")+'</article></div></section>';return}
if(!s.lang){app.innerHTML='<div class="between">'+button("← חזרה","home","light")+'<span class="muted">פרופיל: '+who()+'</span></div><section class="hero"><div class="emoji">👋</div><h1>שלום '+who()+'</h1><p>איזו שפה נלמד היום?</p></section><div class="languages"><article class="lang-card"><div class="avatar">🇹🇭</div><h3>תאית</h3><p>משפטים שימושיים והגייה</p>'+button("התחל ללמוד","lang-thai")+'</article><article class="lang-card"><div class="avatar">🇬🇧</div><h3>אנגלית</h3><p>שיחות, נסיעות ועבודה</p>'+button("התחל ללמוד","lang-english","blue")+'</article></div><section class="panel"><h3>ההתקדמות שלי</h3><p>תאית: '+(db[s.user+"-thai"]||[]).length+' משפטים נלמדו</p><p>אנגלית: '+(db[s.user+"-english"]||[]).length+' משפטים נלמדו</p><div class="note">ההתקדמות נשמרת בדפדפן הזה.</div></section>';return}
if(!s.cat){app.innerHTML='<div class="between">'+button("← שפות","langs","light")+'<span class="muted">'+(s.lang==="thai"?"🇹🇭 תאית":"🇬🇧 אנגלית")+'</span></div><section class="hero"><div class="emoji">🌴</div><h1>לומדים '+(s.lang==="thai"?"תאית":"אנגלית")+'</h1><p>בחר קטגוריה כדי לתרגל</p></section><div class="categories">'+categories.map(c=>'<button class="category" data-action="cat-'+c[0]+'"><span>'+c[1]+'</span><strong>'+c[2]+'</strong><small>'+phrases[s.lang].filter(p=>p[0]===c[0]).length+' משפטים בגרסה זו</small></button>').join("")+'</div><div class="actions">'+button("⭐ מועדפים","favorites","blue")+button("👤 החלפת פרופיל","home","light")+'</div>';return}
if(s.cat==="__favorites"){const fav=phrases[s.lang].filter(p=>(db[s.user+"-favorites"]||[]).includes(id(p)));app.innerHTML='<div class="between">'+button("← קטגוריות","cats","light")+'<span>⭐ מועדפים</span></div><section class="panel"><h2>המשפטים ששמרת</h2>'+(fav.length?fav.map(p=>'<div class="answer">'+p[1]+'<small style="display:block">'+p[3]+'</small></div>').join(""):"עדיין לא שמרת משפטים במועדפים.")+'</section>';return}
const items=list();if(!items.length){s.cat=null;render();return}s.index=Math.min(s.index,items.length-1);const p=items[s.index],learned=db[s.user+"-"+s.lang]||[],fav=db[s.user+"-favorites"]||[];
const choices=[...new Set([p[3],...phrases[s.lang].filter(x=>x!==p).map(x=>x[3])])].sort(()=>Math.random()-.5).slice(0,4);
app.innerHTML='<div class="between">'+button("← קטגוריות","cats","light")+'<span class="muted">'+(s.index+1)+' מתוך '+items.length+'</span></div><section class="panel"><div class="muted">'+(s.lang==="thai"?"🇹🇭 תאית":"🇬🇧 אנגלית")+' · '+(categories.find(c=>c[0]===s.cat)||[])[2]+'</div><div class="phrase">'+p[1]+'</div>'+(s.lang==="thai"?'<div class="roman">'+p[2]+'</div>':'')+'<div class="translation">'+p[3]+'</div><div class="actions">'+button("🔊 השמע","speak")+button(fav.includes(id(p))?"★ נשמר":"☆ מועדפים","favorite","blue")+'</div>'+button(learned.includes(id(p))?"✓ נלמד":"סמן כנלמד","learned","light")+'</section><section class="panel"><strong>תרגול מהיר: בחר את המשמעות</strong>'+choices.map(x=>'<button class="answer" data-action="answer" data-value="'+encodeURIComponent(x)+'">'+x+'</button>').join("")+'<div id="feedback" class="note"></div></section><div class="actions">'+button("→ הבא","next")+button("הקודם","prev","blue")+'</div>';
}
app.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;
if(a==="user-eldad"||a==="user-liora"){s.user=a==="user-eldad"?"eldad":"liora";s.lang=null;s.cat=null}
else if(a==="home"){s={user:null,lang:null,cat:null,index:0}}
else if(a==="langs"){s.lang=null;s.cat=null}
else if(a==="lang-thai"||a==="lang-english"){s.lang=a.slice(5);s.cat=null}
else if(a==="cats"){s.cat=null}
else if(a.startsWith("cat-")){s.cat=a.slice(4);s.index=0}
else if(a==="next"){s.index=(s.index+1)%list().length}
else if(a==="prev"){s.index=Math.max(0,s.index-1)}
else if(a==="learned"){const k=s.user+"-"+s.lang;db[k]??=[];if(!db[k].includes(id(list()[s.index])))db[k].push(id(list()[s.index]));save()}
else if(a==="favorite"){const k=s.user+"-favorites";db[k]??=[];const pid=id(list()[s.index]);db[k]=db[k].includes(pid)?db[k].filter(x=>x!==pid):[...db[k],pid];save()}
else if(a==="favorites"){s.cat="__favorites"}
else if(a==="speak"){const p=list()[s.index];if("speechSynthesis"in window){const u=new SpeechSynthesisUtterance(p[1]);u.lang=s.lang==="thai"?"th-TH":"en-GB";speechSynthesis.speak(u)}else alert("הקראה אינה זמינה במכשיר זה.");return}
else if(a==="answer"){const correct=list()[s.index][3]===decodeURIComponent(b.dataset.value);b.classList.add(correct?"correct":"wrong");const f=document.querySelector("#feedback");if(f)f.textContent=correct?"נכון מאוד!":"לא בדיוק — נסה שוב";return}
render()});
render();
</script>
</body>
</html>
